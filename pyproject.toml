[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "texas-energy"
version = "0.1.0"
description = "Texas Energy Intelligence Platform"
requires-python = ">=3.11"
dependencies = ["boto3>=1.34,<2"]

[project.optional-dependencies]
# Portable, artifact-independent tests run in GitHub Actions.  Spark/Delta,
# MLflow, GPU, and model runtimes stay in their opt-in local environments.
test = [
    "pytest>=8,<10",
    "pandas>=2.1,<3",
    "pyarrow>=14,<20",
]
# Delta Lake 4.0.x is paired with PySpark 4.0.x; keep this heavy local runtime
# out of the Lambda and default CI dependency sets.
silver = ["pyspark==4.0.1", "delta-spark==4.0.1"]
# Local experiment tracking and the contract-only API are optional; neither is
# required by ingestion, Spark processing, Lambda, or CI.
forecast = [
    "mlflow>=2.0,<4",
    "fastapi>=0.110,<1",
    "uvicorn>=0.27,<1",
    # Used only by the opt-in local 24-hour-ahead XGBoost V2 training job.
    "xgboost>=2.1,<3",
    # Used only by the opt-in local zero-shot Chronos-2 evaluation job.
    "chronos-forecasting==2.3.1",
]
# Opt-in local semantic retrieval. The index is always local and never requires
# a managed vector database or paid embedding API.
retrieval = [
    "numpy>=1.26,<3",
    "torch>=2.5,<3",
    "transformers>=4.45,<6",
    "pypdf>=5,<7",
]
# Local/private MCP transport. The server is stdio-only in this phase; remote
# Streamable HTTP is deliberately deferred until authentication is designed.
mcp = ["mcp>=2,<3"]
# Private AgentCore HTTP runtime only. It receives temporary IAM credentials
# from its execution role and downloads a small checksum-verified artifact
# bundle; no forecast model checkpoints or local Hugging Face cache are baked
# into the image.
cloud-agent = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.27,<1",
    "numpy>=1.26,<3",
    "torch>=2.5,<3",
    "transformers>=4.45,<6",
]

[tool.setuptools.packages.find]
where = ["src"]
